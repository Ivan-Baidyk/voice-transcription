[project]
name = "voice-transcription-service"
version = "1.0.0"
description = "FastAPI voice transcription service with Soniox integration, user limits, and PostgreSQL storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
]
